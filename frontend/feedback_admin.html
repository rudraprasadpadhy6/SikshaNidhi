<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="app_logo.jpeg">
    <title>SikshaNidhi | Scholarship · Financial Opportunities</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient: linear-gradient(135deg, #094A53 0%, #062e33 50%, #031e22 100%);
            --surface: rgba(255, 255, 255, 0.08);
            --card: rgba(255, 255, 255, 0.05);
            --border: rgba(72, 197, 185, 0.22);
            --primary: #48C5B9;
            --primary-dark: #094A53;
            --text: #ffffff;
            --muted: #a3c7c4;
            --gold: #FFD54F;
            --danger: #ef4444;
            --success: #22c55e;
            --warn: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
        }

        /* ─── FULL SCREEN LOADING SCREEN ─── */
        #admin-loader-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #094A53 0%, #042024 100%);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 99999; overflow: hidden;
            transition: opacity 0.4s ease;
        }

        #admin-loader-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-content {
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            max-width: 380px; width: 90%;
        }

        .loader-logo-container {
            position: relative; width: 90px; height: 90px;
            margin-bottom: 24px; display: flex;
            align-items: center; justify-content: center;
        }

        .loader-logo-ring {
            width: 72px; height: 72px; border-radius: 50%;
            overflow: hidden; background: white;
            box-shadow: 0 0 35px rgba(72, 197, 185, 0.6);
            z-index: 2; display: flex; align-items: center; justify-content: center;
            border: 2px solid #48C5B9; flex-shrink: 0;
        }

        .loader-logo-ring img {
            width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%;
        }

        .loader-orbit-ring {
            position: absolute; inset: -4px; border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #48C5B9; border-right-color: rgba(72, 197, 185, 0.3);
            animation: spinOrbit 1.2s linear infinite;
        }

        .loader-orbit-ring-outer {
            position: absolute; inset: -12px; border-radius: 50%;
            border: 2px dashed rgba(255, 213, 79, 0.6);
            animation: spinOrbitReverse 3.5s linear infinite;
        }

        @keyframes spinOrbit { to { transform: rotate(360deg); } }
        @keyframes spinOrbitReverse { to { transform: rotate(-360deg); } }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(72, 197, 185, 0.5); }
            50% { transform: scale(1.06); box-shadow: 0 0 45px rgba(72, 197, 185, 0.8); }
        }

        .loader-title {
            font-size: 1.6rem; font-weight: 800; color: #ffffff;
            letter-spacing: 0.5px; margin-bottom: 6px;
        }

        .loader-subtitle {
            font-size: 0.85rem; color: #a3c7c4; font-weight: 500;
            margin-bottom: 22px; min-height: 20px;
        }

        .loader-progress-track {
            width: 100%; height: 6px; background: rgba(255, 255, 255, 0.12);
            border-radius: 10px; overflow: hidden; position: relative;
        }

        .loader-progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #48C5B9, #FFD54F);
            border-radius: 10px;
            transition: width 0.25s ease;
            box-shadow: 0 0 12px rgba(72, 197, 185, 0.8);
        }

        .loader-percent {
            font-size: 0.75rem; font-weight: 700; color: #48C5B9;
            margin-top: 10px; letter-spacing: 1px;
        }

        /* ─── LOGIN GATE ─── */
        #login-gate {
            position: fixed; inset: 0;
            background: var(--bg-gradient);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }

        .login-box {
            background: rgba(9, 74, 83, 0.7);
            border: 1px solid rgba(72, 197, 185, 0.3);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 45px 40px;
            width: 400px; max-width: 92vw;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 30px rgba(72,197,185,0.15);
        }

        .login-box .logo-ring {
            width: 70px; height: 70px;
            background: white; border-radius: 50%; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 25px rgba(72,197,185,0.4);
            border: 3px solid #094A53;
        }

        .login-box .logo-ring img {
            width: 100%; height: 100%; object-fit: cover; transform: scale(1.4); display: block;
        }

        .login-box h1 { font-size: 1.5rem; font-weight: 800; color: #ffffff; margin-bottom: 6px; }
        .login-box p { color: var(--muted); font-size: 0.88rem; margin-bottom: 26px; }

        .login-box input {
            width: 100%; padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(72, 197, 185, 0.3);
            border-radius: 12px; color: #ffffff;
            font-size: 0.95rem; font-family: 'Inter', sans-serif;
            outline: none; margin-bottom: 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-box input:focus {
            border-color: #48C5B9;
            box-shadow: 0 0 0 3px rgba(72,197,185,0.2);
            background: rgba(255, 255, 255, 0.12);
        }

        .login-box button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #48C5B9 0%, #094A53 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 0.95rem; font-weight: 700;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(72,197,185,0.35);
        }
        .login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(72,197,185,0.5); }
        .login-box .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 12px; display: none; }

        /* ─── MAIN PANEL ─── */
        #main-panel { display: none; }

        header {
            background: linear-gradient(135deg, rgba(9, 74, 83, 0.95), rgba(15, 134, 128, 0.95));
            border-bottom: 1px solid rgba(72, 197, 185, 0.3);
            padding: 16px 40px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .header-brand { display: flex; align-items: center; gap: 12px; }
        .logo-wrapper {
            width: 48px; height: 48px; border-radius: 50%;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            background: white; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .app-logo {
            width: 100%; height: 100%; object-fit: cover; transform: scale(1.4); display: block;
        }
        .header-brand h2 { font-size: 1.25rem; font-weight: 800; color: #ffffff; margin: 0; line-height: 1.2; }
        .header-brand p { font-size: 0.8rem; color: var(--muted); margin: 2px 0 0 0; }

        /* ─── DESKTOP SAAS DASHBOARD LAYOUT ─── */
        .dashboard-body {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 40px 50px;
        }

        .header-right-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-nav-icon {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(72, 197, 185, 0.3);
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; cursor: pointer; transition: all 0.2s;
        }
        .header-nav-icon:hover { background: rgba(72, 197, 185, 0.2); border-color: #48C5B9; }

        .admin-profile-chip {
            display: flex; align-items: center; gap: 9px;
            padding: 5px 14px 5px 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(72, 197, 185, 0.3);
            border-radius: 30px; cursor: pointer;
        }
        .admin-avatar-circle {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #48C5B9, #094A53);
            color: white; font-weight: 800; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
        }
        .admin-name { font-size: 0.85rem; font-weight: 700; color: #ffffff; }

        /* ─── PAGE TITLE ROW ─── */
        .page-title-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-title { font-size: 1.6rem; font-weight: 800; color: #ffffff; letter-spacing: -0.3px; }
        .page-subtitle { font-size: 0.88rem; color: #a3c7c4; margin-top: 4px; }

        .btn-action-outline {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(72, 197, 185, 0.3);
            color: #ffffff; padding: 7px 14px; border-radius: 20px; font-size: 0.8rem;
            font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .btn-action-outline:hover { background: rgba(72, 197, 185, 0.2); border-color: #48C5B9; }

        .btn-action-primary {
            background: linear-gradient(135deg, #48C5B9, #0f8680); border: none;
            color: #ffffff; padding: 7px 16px; border-radius: 20px; font-size: 0.8rem;
            font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(72,197,185,0.3);
        }
        .btn-action-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(72,197,185,0.45); }

        /* ─── STATS ROW ─── */
        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-bottom: 28px;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(72, 197, 185, 0.25);
            border-radius: 16px; padding: 22px 24px;
            backdrop-filter: blur(12px); display: flex; align-items: flex-start; gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stat-card:hover { transform: translateY(-3px); border-color: rgba(72,197,185,0.5); box-shadow: 0 15px 35px rgba(9,74,83,0.4); }
        
        .stat-icon-wrapper {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .ic-teal { background: rgba(72, 197, 185, 0.15); }
        .ic-gold { background: rgba(255, 213, 79, 0.15); }
        .ic-red  { background: rgba(239, 68, 68, 0.15); }

        .stat-card .label { font-size: 0.72rem; color: #a3c7c4; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
        .stat-card .value { font-size: 2.1rem; font-weight: 800; color: #ffffff; line-height: 1.1; }
        .stat-card .sub { font-size: 0.76rem; color: #84aab5; margin-top: 4px; }

        /* ─── DESKTOP SINGLE COLUMN CONTENT GRID ─── */
        .desktop-content-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .left-feedback-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .column-header {
            display: flex; align-items: center; justify-content: space-between;
        }
        .column-header h2 {
            font-size: 1rem; font-weight: 800; letter-spacing: 1px; color: #48C5B9; text-transform: uppercase;
        }

        .sort-wrapper {
            display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: #a3c7c4;
        }
        .sort-wrapper select {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(72, 197, 185, 0.25);
            border-radius: 8px; color: white; padding: 5px 10px; font-family: 'Inter', sans-serif;
            font-size: 0.82rem; outline: none; cursor: pointer;
        }
        .sort-wrapper select option { background: #094A53; color: white; }

        .filter-search-container {
            display: flex; flex-direction: column; gap: 14px;
        }

        .search-box {
            position: relative; width: 100%;
        }
        .search-box input {
            width: 100%; padding: 11px 16px 11px 40px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(72, 197, 185, 0.25);
            border-radius: 12px; color: #ffffff; font-family: 'Inter', sans-serif;
            font-size: 0.88rem; outline: none; transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #48C5B9; box-shadow: 0 0 0 3px rgba(72,197,185,0.2); }
        .search-box svg {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            width: 17px; height: 17px; color: #a3c7c4;
        }

        .filter-bar {
            display: flex; gap: 6px; flex-wrap: wrap; align-items: center; width: 100%;
        }
        .filter-btn {
            padding: 6px 12px; border-radius: 16px;
            border: 1px solid rgba(72, 197, 185, 0.25);
            background: rgba(255, 255, 255, 0.06); color: #a3c7c4; cursor: pointer;
            font-size: 0.78rem; font-weight: 600; font-family: 'Inter', sans-serif;
            transition: all 0.2s; backdrop-filter: blur(8px);
            white-space: nowrap; flex-shrink: 0;
        }
        .filter-btn.active, .filter-btn:hover {
            background: linear-gradient(135deg, #48C5B9, #094A53);
            color: #ffffff; border-color: #48C5B9;
            box-shadow: 0 4px 12px rgba(72, 197, 185, 0.3);
        }

        #feedback-grid {
            display: flex; flex-direction: column; gap: 16px;
        }

        /* ─── ANALYTICS CARD (Right Column) ─── */
        .right-analytics-column {
            position: sticky; top: 90px;
        }
        .analytics-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(72, 197, 185, 0.25);
            border-radius: 18px; padding: 24px;
            backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .analytics-title { font-size: 1.15rem; font-weight: 800; color: #ffffff; margin-bottom: 2px; }
        .analytics-subtitle { font-size: 0.8rem; color: #a3c7c4; margin-bottom: 20px; }

        .category-bars-list { display: flex; flex-direction: column; gap: 14px; }
        .cat-bar-item { display: flex; flex-direction: column; gap: 6px; }
        .cat-bar-info { display: flex; justify-content: space-between; font-size: 0.82rem; color: #e2eaf5; font-weight: 600; }
        .cat-count { color: #48C5B9; font-weight: 700; }
        .cat-progress-track {
            height: 7px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden;
        }
        .cat-progress-fill { height: 100%; border-radius: 10px; transition: width 0.4s ease; }

        .analytics-divider { height: 1px; background: rgba(72, 197, 185, 0.2); margin: 20px 0; }

        .analytics-rating-box {
            background: rgba(9, 74, 83, 0.4); border: 1px solid rgba(72, 197, 185, 0.3);
            border-radius: 14px; padding: 16px; text-align: center;
        }
        .rating-box-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: #a3c7c4; font-weight: 700; }
        .rating-box-score { font-size: 2.2rem; font-weight: 800; color: #FFD54F; margin: 4px 0 2px; }
        .rating-stars-visual { color: #FFD54F; font-size: 1.1rem; letter-spacing: 2px; }

        .feedback-section-header {
            display: none;
        }

        /* ─── LAPTOP / DESKTOP BIG INTERFACE (min-width: 951px) ─── */
        @media (min-width: 951px) {
            /* Admin Loader Screen Scaling */
            .loader-content {
                max-width: 520px !important;
            }
            .loader-logo-container {
                width: 160px !important;
                height: 160px !important;
                margin-bottom: 30px !important;
            }
            .loader-logo-ring {
                width: 135px !important;
                height: 135px !important;
                border-width: 4px !important;
                box-shadow: 0 0 50px rgba(72, 197, 185, 0.8) !important;
            }
            .loader-title {
                font-size: 2.6rem !important;
                margin-bottom: 10px !important;
            }
            .loader-subtitle {
                font-size: 1.25rem !important;
                margin-bottom: 30px !important;
            }
            .loader-progress-track {
                height: 10px !important;
                border-radius: 12px !important;
            }
            .loader-percent {
                font-size: 1.1rem !important;
                margin-top: 14px !important;
            }

            /* Login Gate Scaling */
            .login-box {
                width: 520px !important;
                padding: 55px 48px !important;
                border-radius: 28px !important;
            }
            .login-box .logo-ring {
                width: 100px !important;
                height: 100px !important;
                border-width: 4px !important;
                margin-bottom: 24px !important;
            }
            .login-box h1 {
                font-size: 2.2rem !important;
                margin-bottom: 8px !important;
            }
            .login-box p {
                font-size: 1.15rem !important;
                margin-bottom: 32px !important;
            }
            .login-box input {
                padding: 18px 22px !important;
                font-size: 1.25rem !important;
                border-radius: 16px !important;
                margin-bottom: 22px !important;
            }
            .login-box button {
                padding: 18px !important;
                font-size: 1.25rem !important;
                border-radius: 16px !important;
            }

            /* Header Scaling */
            header {
                padding: 26px 60px !important;
            }
            .logo-wrapper {
                width: 72px !important;
                height: 72px !important;
            }
            .header-brand h2 {
                font-size: 2.2rem !important;
                font-weight: 800 !important;
            }
            .header-brand p {
                font-size: 1.2rem !important;
            }
            .header-nav-icon {
                width: 56px !important;
                height: 56px !important;
            }
            .header-nav-icon svg {
                width: 26px !important;
                height: 26px !important;
            }
            .admin-profile-chip {
                padding: 10px 24px 10px 10px !important;
                gap: 14px !important;
                border-radius: 36px !important;
            }
            .admin-avatar-circle {
                width: 44px !important;
                height: 44px !important;
                font-size: 20px !important;
            }
            .admin-name {
                font-size: 1.35rem !important;
                font-weight: 800 !important;
            }

            /* Dashboard Main Body & Cards */
            .dashboard-body {
                max-width: 1750px !important;
                padding: 45px 60px 80px !important;
            }
            .page-title {
                font-size: 3rem !important;
            }
            .page-subtitle {
                font-size: 1.35rem !important;
            }
            .column-header h2 {
                font-size: 1.5rem !important;
                font-weight: 900 !important;
            }
            .sort-wrapper {
                font-size: 1.2rem !important;
            }
            .sort-wrapper select {
                padding: 12px 20px !important;
                font-size: 1.15rem !important;
                border-radius: 14px !important;
            }
            .btn-action-primary, .btn-action-outline {
                padding: 14px 28px !important;
                font-size: 1.25rem !important;
                border-radius: 28px !important;
                font-weight: 700 !important;
            }
            .btn-action-primary svg, .btn-action-outline svg {
                width: 24px !important;
                height: 24px !important;
            }
            .stats-row {
                gap: 32px !important;
                margin-bottom: 42px !important;
            }
            .stat-card {
                padding: 34px 38px !important;
                border-radius: 24px !important;
                gap: 22px !important;
            }
            .stat-icon-wrapper {
                width: 68px !important;
                height: 68px !important;
                border-radius: 20px !important;
            }
            .stat-icon-wrapper svg {
                width: 34px !important;
                height: 34px !important;
            }
            .stat-card .label {
                font-size: 1.05rem !important;
                letter-spacing: 1.2px !important;
                margin-bottom: 8px !important;
            }
            .stat-card .value {
                font-size: 3.6rem !important;
                line-height: 1 !important;
            }
            .stat-card .sub {
                font-size: 1.1rem !important;
                margin-top: 6px !important;
            }
            .search-box input {
                padding: 20px 24px 20px 60px !important;
                font-size: 1.35rem !important;
                border-radius: 20px !important;
            }
            .search-box svg {
                width: 26px !important;
                height: 26px !important;
                left: 22px !important;
            }
            .filter-bar {
                gap: 12px !important;
                margin-top: 8px !important;
            }
            .filter-btn {
                padding: 14px 26px !important;
                font-size: 1.15rem !important;
                font-weight: 700 !important;
                border-radius: 26px !important;
            }
            #empty-state {
                padding: 70px 30px !important;
            }
            #empty-state div[style*="font-size"] {
                font-size: 4.5rem !important;
            }
            #empty-state h3 {
                font-size: 1.75rem !important;
                margin-bottom: 10px !important;
            }
            #empty-state p {
                font-size: 1.3rem !important;
            }
            .feedback-card {
                padding: 30px 36px !important;
                border-radius: 24px !important;
            }
            .user-avatar {
                width: 56px !important;
                height: 56px !important;
                font-size: 1.45rem !important;
            }
            .user-name {
                font-size: 1.45rem !important;
                font-weight: 800 !important;
            }
            .user-time {
                font-size: 1.05rem !important;
            }
            .stars .star {
                font-size: 1.75rem !important;
            }
            .category-badge {
                font-size: 1.1rem !important;
                padding: 8px 18px !important;
                border-radius: 12px !important;
            }
            .card-message {
                font-size: 1.4rem !important;
                line-height: 1.7 !important;
            }
            .card-meta {
                font-size: 1.1rem !important;
            }
            .action-btn {
                padding: 12px 24px !important;
                font-size: 1.1rem !important;
                border-radius: 16px !important;
            }
            .action-btn svg {
                width: 18px !important;
                height: 18px !important;
            }
        }

        /* ─── MOBILE ONLY OVERRIDES (< 768px) ─── */
        @media (max-width: 767px) {
            body {
                overflow-x: hidden;
            }

            .dashboard-body {
                padding: 16px 14px 40px;
            }

            .page-title-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                margin-bottom: 18px;
            }

            .page-title { font-size: 1.3rem; }
            .page-subtitle { font-size: 0.8rem; }

            .header-right-controls {
                display: none;
            }

            .login-box {
                width: 92vw;
                max-width: 380px;
                padding: 35px 24px;
            }

            .login-box input {
                font-size: 16px;
            }

            header {
                padding: 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header-actions {
                width: 100%;
                display: flex;
                gap: 10px;
                align-items: center;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .btn-action-outline, .btn-action-primary {
                padding: 8px 14px;
                font-size: 0.8rem;
                border-radius: 20px;
            }

            /* Compact Statistics Grid: 2 side-by-side, Unread full width below */
            .stats-row {
                grid-template-columns: 1fr 1fr;
                padding: 0;
                margin-bottom: 20px;
                gap: 10px;
            }

            .stats-row .stat-card:nth-child(3) {
                grid-column: 1 / -1;
            }

            .stat-card {
                padding: 14px 14px;
                border-radius: 14px;
                gap: 10px;
            }

            .stat-icon-wrapper {
                width: 36px; height: 36px;
            }

            .stat-card .label {
                font-size: 0.68rem;
                letter-spacing: 0.6px;
                margin-bottom: 4px;
            }

            .stat-card .value {
                font-size: 1.6rem;
            }

            .stat-card .sub {
                font-size: 0.7rem;
            }

            /* Desktop content grid to single column on mobile */
            .desktop-content-grid {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .right-analytics-column {
                position: static;
                order: 2;
            }

            .left-feedback-column {
                order: 1;
            }

            /* Filter Chips Wrap to prevent horizontal scrolling */
            .filter-bar {
                padding: 0;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                overflow-x: visible;
                gap: 6px;
                width: 100%;
                align-items: center;
            }

            .filter-btn {
                flex-shrink: 0;
                white-space: nowrap;
                padding: 5px 10px;
                font-size: 0.75rem;
            }

            .feedback-section-header {
                display: none;
            }

            #feedback-grid {
                display: grid;
                grid-template-columns: 1fr;
                padding: 0;
                gap: 12px;
            }

            .feedback-card {
                padding: 16px;
                border-radius: 14px;
            }
        }
    </style>
  <script src="/config.js"></script>
</head>
<body>

<!-- ─── LOADING SCREEN ─── -->
<div id="admin-loader-screen">
    <div class="loader-content">
        <div class="loader-logo-container">
            <div class="loader-orbit-ring"></div>
            <div class="loader-orbit-ring-outer"></div>
            <div class="loader-logo-ring">
                <img src="app_logo.jpeg" alt="SikshaNidhi Logo">
            </div>
        </div>
        <h2 class="loader-title">SikshaNidhi</h2>
        <p class="loader-subtitle" id="loader-status-text">Initializing Secure Workspace...</p>
        <div class="loader-progress-track">
            <div class="loader-progress-bar" id="loader-progress-bar"></div>
        </div>
        <div class="loader-percent" id="loader-percent">0%</div>
    </div>
</div>

<!-- ─── LOGIN GATE ─── -->
<div id="login-gate">
    <div class="login-box">
        <div class="logo-ring">
            <img src="app_logo.jpeg" alt="SikshaNidhi Logo">
        </div>
        <h1>Admin Access</h1>
        <p>Enter your secret key to view feedback</p>
        <input type="password" id="admin-key-input" placeholder="Enter admin key..." onkeypress="if(event.key==='Enter')verifyKey()">
        <button onclick="verifyKey()" style="display:flex;align-items:center;justify-content:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> Unlock Panel</button>
        <div class="error-msg" id="login-error" style="display:none;align-items:center;justify-content:center;gap:6px;color:#ef4444;font-size:0.85rem;margin-top:12px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Wrong key. Try again.</div>
    </div>
</div>

<!-- ─── MAIN PANEL ─── -->
<div id="main-panel">
    <!-- Header -->
    <header>
        <div class="header-brand">
            <div class="logo-wrapper">
                <img src="app_logo.jpeg" alt="SikshaNidhi Logo" class="app-logo">
            </div>
            <div>
                <h2>SikshaNidhi</h2>
                <p>Admin Dashboard</p>
            </div>
        </div>
        <div class="header-right-controls">
            <button class="btn-action-outline" onclick="exportCSV()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Export CSV
            </button>
            <button class="btn-action-primary" onclick="loadFeedback()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                Refresh
            </button>
            <div class="header-nav-icon" title="Notifications">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <div class="admin-profile-chip" title="Admin Account">
                <div class="admin-avatar-circle">A</div>
                <span class="admin-name">Admin</span>
            </div>
        </div>
    </header>

    <main class="dashboard-body">

        <!-- 3 Stats Cards in a Row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon-wrapper ic-teal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#48C5B9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <div class="stat-content">
                    <div class="label">TOTAL FEEDBACK</div>
                    <div class="value" id="stat-total">—</div>
                    <div class="sub">All time submissions</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrapper ic-gold">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </div>
                <div class="stat-content">
                    <div class="label">AVG RATING</div>
                    <div class="value" id="stat-avg">—</div>
                    <div class="sub" id="stat-avg-sub">Out of 5 stars</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrapper ic-red">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </div>
                <div class="stat-content">
                    <div class="label">UNREAD</div>
                    <div class="value" id="stat-unread">—</div>
                    <div class="sub">Needs attention</div>
                </div>
            </div>
        </div>

        <!-- 2 Column Desktop Layout: Left = Feedback Management, Right = Analytics -->
        <div class="desktop-content-grid">
            
            <!-- Left Column: Feedback Stream -->
            <div class="left-feedback-column">
                <div class="column-header">
                    <h2>FEEDBACK</h2>
                    <div class="sort-wrapper">
                        <label for="sort-select">Sort:</label>
                        <select id="sort-select" onchange="renderCards()">
                            <option value="latest">Latest ▼</option>
                            <option value="oldest">Oldest ▲</option>
                            <option value="rating-high">Highest Rating</option>
                            <option value="rating-low">Lowest Rating</option>
                        </select>
                    </div>
                </div>

                <div class="filter-search-container">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-input" placeholder="Search feedback..." oninput="renderCards()">
                    </div>
                    <div class="filter-bar">
                        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
                        <button class="filter-btn" onclick="setFilter('unread', this)">Unread</button>
                        <button class="filter-btn" onclick="setFilter('Bug Report', this)">Bug</button>
                        <button class="filter-btn" onclick="setFilter('Feature Suggestion', this)">Suggestion</button>
                        <button class="filter-btn" onclick="setFilter('Compliment', this)">Compliment</button>
                        <button class="filter-btn" onclick="setFilter('General Feedback', this)">General</button>
                    </div>
                </div>

                <div id="feedback-grid">
                    <div id="loader">
                        <div class="spinner"></div>
                        <p style="color: var(--muted); font-size:0.9rem;">Loading feedback...</p>
                    </div>
                </div>
            </div>

        </div><!-- end desktop-content-grid -->

    </main>
</div>

<!-- Toast -->
<div id="toast" style="display:none;align-items:center;gap:8px;"></div>

<script>
    const API = window.API_BASE || window.API_BASE_URL || window.API_URL || 'https://sikshanidhi-2.onrender.com';
    let adminKey = '';
    let allFeedback = [];
    let activeFilter = 'all';

    // ─── ANIMATED LOADING SCREEN ───
    function triggerLoadingScreen(onComplete) {
        const loader = document.getElementById('admin-loader-screen');
        const bar = document.getElementById('loader-progress-bar');
        const pct = document.getElementById('loader-percent');
        const status = document.getElementById('loader-status-text');

        if (!loader) { if (onComplete) onComplete(); return; }

        loader.classList.remove('fade-out');
        loader.style.display = 'flex';
        loader.style.opacity = '1';

        const steps = [
            { progress: 30, text: 'Authenticating Credentials...' },
            { progress: 65, text: 'Connecting to SikshaNidhi Stream...' },
            { progress: 90, text: 'Syncing Feedback Records...' },
            { progress: 100, text: 'Workspace Ready!' }
        ];

        let currentStep = 0;
        const interval = setInterval(() => {
            if (currentStep < steps.length) {
                const s = steps[currentStep];
                if (bar) bar.style.width = s.progress + '%';
                if (pct) pct.textContent = s.progress + '%';
                if (status) status.textContent = s.text;
                currentStep++;
            } else {
                clearInterval(interval);
                setTimeout(() => {
                    loader.classList.add('fade-out');
                    setTimeout(() => {
                        loader.style.display = 'none';
                        if (onComplete) onComplete();
                    }, 400);
                }, 200);
            }
        }, 220);
    }

    // ─── VERIFY KEY ───
    async function verifyKey() {
        const key = document.getElementById('admin-key-input').value.trim();
        if (!key) return;

        try {
            const res = await fetch(`${API}/api/feedback/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            });
            const data = await res.json();

            if (data.status === 'success') {
                adminKey = key;
                document.getElementById('login-gate').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
                loadStats();
                loadFeedback();
                triggerLoadingScreen();
            } else {
                const err = document.getElementById('login-error');
                err.style.display = 'flex';
                setTimeout(() => err.style.display = 'none', 3000);
            }
        } catch (e) {
            alert('Cannot connect to backend. Make sure backend server is running.');
        }
    }

    // ─── LOAD STATS ───
    async function loadStats() {
        try {
            const res = await fetch(`${API}/api/feedback/stats`, {
                headers: { 'X-Admin-Key': adminKey }
            });
            const data = await res.json();
            if (data.status === 'success') {
                document.getElementById('stat-total').textContent = data.total;
                document.getElementById('stat-avg').textContent = data.avg_rating + ' ★';
                document.getElementById('stat-unread').textContent = data.unread;
            }
        } catch (e) { console.error('Stats error', e); }
    }

    // ─── LOAD ALL FEEDBACK ───
    async function loadFeedback() {
        document.getElementById('feedback-grid').innerHTML = `
            <div id="loader">
                <div class="spinner"></div>
                <p style="color: var(--muted); font-size:0.9rem;">Loading feedback...</p>
            </div>`;
        try {
            const res = await fetch(`${API}/api/feedback/all`, {
                headers: { 'X-Admin-Key': adminKey }
            });
            const data = await res.json();
            if (data.status === 'success') {
                allFeedback = data.data;
                renderCards();
            }
        } catch (e) {
            document.getElementById('feedback-grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--danger);">Failed to load feedback. Check backend.</div>`;
        }
    }

    // ─── SET FILTER ───
    function setFilter(filter, btn) {
        activeFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards();
    }

    // ─── RENDER CARDS & UPDATE ANALYTICS ───
    function renderCards() {
        const searchInput = document.getElementById('search-input');
        const search = (searchInput ? searchInput.value : '').toLowerCase();

        let filtered = allFeedback.filter(f => {
            const matchesFilter =
                activeFilter === 'all' ? true :
                activeFilter === 'unread' ? f.is_read === 0 :
                f.category === activeFilter;
            const matchesSearch = !search ||
                (f.message || '').toLowerCase().includes(search) ||
                (f.user_name || '').toLowerCase().includes(search) ||
                (f.category || '').toLowerCase().includes(search);
            return matchesFilter && matchesSearch;
        });

        // Sorting Logic
        const sortSelect = document.getElementById('sort-select');
        const sortMode = sortSelect ? sortSelect.value : 'latest';
        if (sortMode === 'latest') {
            filtered.sort((a, b) => (b.id || 0) - (a.id || 0));
        } else if (sortMode === 'oldest') {
            filtered.sort((a, b) => (a.id || 0) - (b.id || 0));
        } else if (sortMode === 'rating-high') {
            filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        } else if (sortMode === 'rating-low') {
            filtered.sort((a, b) => (a.rating || 0) - (b.rating || 0));
        }

        const grid = document.getElementById('feedback-grid');

        if (filtered.length === 0) {
            grid.innerHTML = `<div id="empty-state" style="display:block; grid-column:1/-1; text-align:center; padding:50px 20px;">
                <div style="margin-bottom:12px; font-size:2.6rem;">💬</div>
                <h3 style="color:#ffffff; font-size:1.1rem; font-weight:700; margin-bottom:6px;">No feedback yet</h3>
                <p style="color:var(--muted); font-size:0.85rem;">Feedback submissions from users will appear here.</p>
            </div>`;
        } else {
            grid.innerHTML = filtered.map(f => buildCard(f)).join('');
        }

        updateAnalytics();
    }

    // ─── UPDATE ANALYTICS ───
    function updateAnalytics() {
        const total = allFeedback.length;
        const avgSub = document.getElementById('stat-avg-sub');
        if (avgSub) avgSub.textContent = `From ${total} reviews`;
    }

    // ─── BUILD CARD HTML ───
    function buildCard(f) {
        const stars = [1,2,3,4,5].map(i =>
            `<span class="star ${i <= f.rating ? 'filled' : 'empty'}">${i <= f.rating ? '★' : '☆'}</span>`
        ).join('');

        const badgeClass = {
            'Bug Report': 'badge-bug',
            'Feature Suggestion': 'badge-suggestion',
            'Compliment': 'badge-compliment',
            'General Feedback': 'badge-general'
        }[f.category] || 'badge-general';

        const initials = (f.user_name || 'A').charAt(0).toUpperCase();
        const dateStr = f.submitted_at ? new Date(f.submitted_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
        const readClass = f.is_read ? 'read' : 'unread';

        return `
        <div class="feedback-card ${readClass}" id="card-${f.id}">
            <div class="card-top">
                <div class="card-user">
                    <div class="user-avatar">${initials}</div>
                    <div>
                        <div class="user-name">${escapeHtml(f.user_name)}</div>
                        <div class="user-time">${dateStr}</div>
                    </div>
                </div>
                <div class="stars">${stars}</div>
            </div>
            <div>
                <span class="category-badge ${badgeClass}">${f.category}</span>
            </div>
            <div class="card-message">${escapeHtml(f.message)}</div>
            <div class="card-meta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                Submitted from: <strong style="color:var(--text)">${escapeHtml(f.page)}</strong>
            </div>
            <div class="card-actions">
                ${!f.is_read ? `<button class="action-btn mark-read" onclick="markRead(${f.id})" style="display:flex;align-items:center;justify-content:center;gap:5px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Mark Read</button>` : `<button class="action-btn" disabled style="cursor:default; opacity:0.4; display:flex;align-items:center;justify-content:center;gap:5px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Read</button>`}
                <button class="action-btn delete-btn" onclick="deleteFeedback(${f.id})" style="display:flex;align-items:center;justify-content:center;gap:5px;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg> Delete
                </button>
            </div>
        </div>`;
    }

    // ─── MARK AS READ ───
    async function markRead(id) {
        try {
            await fetch(`${API}/api/feedback/mark-read/${id}`, {
                method: 'PATCH', headers: { 'X-Admin-Key': adminKey }
            });
            const idx = allFeedback.findIndex(f => f.id === id);
            if (idx !== -1) allFeedback[idx].is_read = 1;
            renderCards();
            loadStats();
            showToast('Marked as read');
        } catch (e) { alert('Error: ' + e.message); }
    }

    // ─── DELETE FEEDBACK ───
    async function deleteFeedback(id) {
        if (!confirm('Are you sure you want to delete this feedback?')) return;
        try {
            await fetch(`${API}/api/feedback/delete/${id}`, {
                method: 'DELETE', headers: { 'X-Admin-Key': adminKey }
            });
            allFeedback = allFeedback.filter(f => f.id !== id);
            renderCards();
            loadStats();
            showToast('Feedback deleted');
        } catch (e) { alert('Error: ' + e.message); }
    }

    // ─── EXPORT CSV ───
    async function exportCSV() {
        const link = document.createElement('a');
        link.href = `${API}/api/feedback/export`;
        const headers = { 'X-Admin-Key': adminKey };
        try {
            const res = await fetch(link.href, { headers });
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'SikshaNidhi_Feedback.csv'; a.click();
            showToast('CSV downloaded!');
        } catch (e) { alert('Export failed.'); }
    }

    // ─── HELPERS ───
    function escapeHtml(text) {
        return String(text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ${msg}`;
        t.style.display = 'flex';
        setTimeout(() => t.style.display = 'none', 2500);
    }
</script>
</body>
</html>
