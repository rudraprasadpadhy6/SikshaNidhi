<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="app_logo.jpeg">
    <title data-i18n="login_page_title">SikshaNidhi | Scholarship · Financial Opportunities</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- Base Reset & Typography --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1e293b;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Main Split Screen Container --- */
        .page-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        /* --- Left Hero Section --- */
        .hero-section {
            flex: 1;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #faf7fc;
            padding: 0;
        }

        .hero-full-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            filter: contrast(1.06) brightness(1.03) saturate(1.06);
            transition: filter 0.3s ease;
        }

        /* --- Right Form Section --- */
        .form-section {
            flex: 1;
            height: 100vh;
            max-height: 100vh;
            overflow-y: auto;
            background: #ffffff;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Top Right AI & Language Bar */
        .top-right-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            width: 100%;
            margin-bottom: 25px;
        }

        .ai-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 700;
            color: #1e1b4b;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            user-select: none;
        }

        .lang-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 7px 11px;
            cursor: pointer;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            transform: scale(1.05);
        }

        /* Form Container Wrappers */
        .form-wrapper {
            max-width: 400px;
            width: 100%;
            margin: auto;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .form-wrapper.hidden {
            display: none;
            opacity: 0;
            transform: translateY(15px);
        }

        .welcome-subtitle {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #5850ec;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-title {
            font-family: 'Outfit', 'Inter', sans-serif;
            font-size: 30px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        /* Input Elements & Labels */
        .field-group {
            margin-bottom: 22px;
        }

        .field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .field-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .forgot-link {
            font-size: 13px;
            font-weight: 600;
            color: #5850ec;
            text-decoration: none;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        .forgot-link:hover {
            color: #3730a3;
            text-decoration: underline;
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 16px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .input-field {
            width: 100%;
            padding: 13px 16px 13px 44px;
            font-size: 14px;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field.has-eye {
            padding-right: 44px;
        }

        .input-field::placeholder {
            color: #9ca3af;
        }

        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .input-field:disabled {
            background: #f8fafc;
            cursor: not-allowed;
            color: #9ca3af;
        }

        .eye-toggle {
            position: absolute;
            right: 16px;
            cursor: pointer;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            user-select: none;
        }

        .eye-toggle:hover {
            color: #4b5563;
        }

        /* Main Submit Button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 26px;
            background: #4f46e5;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        }

        .submit-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .form-footer-text {
            text-align: center;
            margin-top: 36px;
            font-size: 14px;
            color: #4b5563;
        }

        .form-footer-text a {
            color: #5850ec;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            margin-left: 4px;
            transition: color 0.2s ease;
        }

        .form-footer-text a:hover {
            color: #3730a3;
            text-decoration: underline;
        }

        /* Error Banner */
        .error-message {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 22px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Layout for Mobile & Tablet */
        @media (max-width: 960px) {
            body {
                height: auto;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .page-container {
                flex-direction: column;
                height: auto;
                max-height: none;
                overflow: visible;
                width: 100%;
            }

            .hero-section {
                padding: 0;
                width: 100%;
                height: auto;
                max-height: 380px;
            }

            .hero-full-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .form-section {
                padding: 35px 25px;
                height: auto;
                max-height: none;
                overflow-y: visible;
                width: 100%;
            }
        }

        /* Mobile Phone Screen Specifics (< 768px) */
        @media (max-width: 767px) {
            body {
                width: 100%;
                overflow-x: hidden;
            }

            .hero-section {
                max-height: 240px;
            }

            .form-section {
                padding: 24px 18px;
            }

            .form-wrapper {
                width: 100%;
                max-width: 100%;
            }

            .form-title {
                font-size: 1.5rem;
                margin-bottom: 24px;
            }

            .input-field {
                font-size: 16px; /* Prevents auto-zoom on mobile safari */
            }

            .top-right-bar {
                margin-bottom: 15px;
            }

            .splash-stage {
                width: 90vw;
                max-width: 90vw;
                padding: 10px;
            }

            .splash-app-name {
                font-size: 32px !important;
                text-align: center;
            }

            .splash-tagline {
                font-size: 11px !important;
                letter-spacing: 1px !important;
                text-align: center;
            }

            .logo-sweep-container {
                width: 100px !important;
                height: 100px !important;
            }

            .splash-logo-ring {
                width: 90px !important;
                height: 90px !important;
            }

            .splash-bar-wrap {
                width: 170px !important;
            }
        }

        /* Extra Small Screens (<= 380px) */
        @media (max-width: 380px) {
            .hero-section {
                max-height: 180px;
            }

            .form-section {
                padding: 18px 12px;
            }

            .form-title {
                font-size: 1.35rem;
            }

            .submit-btn {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
    <script src="/config.js"></script>
</head>

<body>

    <!-- Intro Splash Screen: LIGHT SWEEP LOGO REVEAL -->
    <style>
        #intro-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100000;
            background: linear-gradient(135deg, #042429 0%, #094A53 45%, #0f6c65 75%, #187a73 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.9s ease;
        }

        .splash-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* 1, 3 & 4. Logo Sweep Container & Faint-to-Bright Logo Badge */
        .logo-sweep-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 50%;
        }

        .splash-logo-ring {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid rgba(72, 197, 185, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            /* 1. Logo Starts Faint */
            opacity: 0.25;
            filter: brightness(0.4) blur(0.5px);
            /* 3 & 4. Logo Illuminates as Light Sweeps Across */
            animation: illuminateLogo 1.6s cubic-bezier(0.25, 1, 0.5, 1) 0.7s forwards, logoBreathe 3s ease-in-out 2.3s infinite alternate;
        }

        @keyframes illuminateLogo {
            0% { opacity: 0.25; filter: brightness(0.4) blur(0.5px); border-color: rgba(72, 197, 185, 0.3); box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); }
            50% { opacity: 0.75; filter: brightness(0.85); }
            100% { opacity: 1; filter: brightness(1) blur(0px); border-color: #48C5B9; box-shadow: 0 0 35px rgba(72, 197, 185, 0.5), 0 0 15px rgba(255, 225, 120, 0.3); }
        }

        @keyframes logoBreathe {
            0% { box-shadow: 0 0 30px rgba(72, 197, 185, 0.4), 0 0 12px rgba(255, 225, 120, 0.2); }
            100% { box-shadow: 0 0 45px rgba(72, 197, 185, 0.75), 0 0 20px rgba(255, 225, 120, 0.45); }
        }

        .splash-logo-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            transform: scale(1.35);
        }

        /* 2 & 3. Light Streak Beam Sweeping LEFT -> RIGHT Across Logo */
        .light-sweep-beam {
            position: absolute;
            top: -20%;
            left: -150%;
            width: 75%;
            height: 140%;
            background: linear-gradient(105deg, 
                transparent 0%, 
                rgba(72, 197, 185, 0.15) 30%, 
                rgba(255, 225, 120, 0.75) 50%, 
                rgba(72, 197, 185, 0.85) 65%, 
                transparent 100%);
            transform: skewX(-25deg);
            pointer-events: none;
            z-index: 10;
            filter: blur(3px);
            animation: sweepLight 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
        }

        @keyframes sweepLight {
            0% { left: -150%; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { left: 200%; opacity: 0; }
        }

        /* Subtle Trailing Sparkles */
        .sweep-sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 12;
            overflow: hidden;
            border-radius: 50%;
        }

        .sparkle-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffe599;
            border-radius: 50%;
            box-shadow: 0 0 6px #ffe599, 0 0 10px #48C5B9;
            opacity: 0;
        }

        .sp1 { top: 35%; left: 30%; animation: sparkleFade 1.2s ease 0.9s forwards; }
        .sp2 { top: 55%; left: 50%; animation: sparkleFade 1.2s ease 1.1s forwards; }
        .sp3 { top: 40%; left: 70%; animation: sparkleFade 1.2s ease 1.3s forwards; }

        @keyframes sparkleFade {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.9; transform: scale(1.4); }
            100% { opacity: 0; transform: scale(0.4); }
        }

        /* 5. Brand Name & Tagline Reveal (Subtle Upward Motion & Fade) */
        .splash-app-name {
            font-family: 'Outfit', sans-serif;
            font-size: 46px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 6px;
            opacity: 0;
            transform: translateY(14px);
            animation: revealUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .splash-tagline {
            font-size: 13.5px;
            color: #e0f7fa;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0;
            transform: translateY(12px);
            animation: revealUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.9s forwards;
        }

        @keyframes revealUp {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 6. Sleek Minimal Progress Bar */
        .splash-bar-wrap {
            margin-top: 36px;
            width: 220px;
            height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 99px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.8s ease 1.4s forwards;
        }

        .splash-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #48C5B9 0%, #ffe599 70%, #a5e8e2 100%);
            border-radius: 99px;
            box-shadow: 0 0 10px rgba(72, 197, 185, 0.6);
            animation: fillProgress 3.0s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Twinkling Background Stars */
        .splash-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .star-sparkle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9), 0 0 12px rgba(72, 197, 185, 0.7);
            animation: starTwinkle 2.8s infinite ease-in-out alternate;
        }

        .star-cross {
            position: absolute;
            color: rgba(255, 225, 120, 0.9);
            font-size: 11px;
            animation: starTwinkle 3.2s infinite ease-in-out alternate;
            user-select: none;
            filter: drop-shadow(0 0 6px rgba(72, 197, 185, 0.7));
        }

        @keyframes starTwinkle {
            0% { opacity: 0.15; transform: scale(0.6); }
            50% { opacity: 0.95; transform: scale(1.3); }
            100% { opacity: 0.25; transform: scale(0.7); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>

    <div id="intro-overlay">
        <!-- Twinkling Background Stars -->
        <div class="splash-stars">
            <span class="star-sparkle" style="top: 15%; left: 18%; width: 3px; height: 3px; animation-delay: 0.2s;"></span>
            <span class="star-sparkle" style="top: 25%; left: 82%; width: 4px; height: 4px; animation-delay: 0.7s;"></span>
            <span class="star-sparkle" style="top: 70%; left: 12%; width: 3px; height: 3px; animation-delay: 1.1s;"></span>
            <span class="star-sparkle" style="top: 75%; left: 85%; width: 4px; height: 4px; animation-delay: 0.4s;"></span>
            <span class="star-sparkle" style="top: 40%; left: 8%;  width: 2px; height: 2px; animation-delay: 1.5s;"></span>
            <span class="star-sparkle" style="top: 35%; left: 92%; width: 3px; height: 3px; animation-delay: 0.9s;"></span>
            <span class="star-sparkle" style="top: 85%; left: 30%; width: 2px; height: 2px; animation-delay: 1.8s;"></span>
            <span class="star-sparkle" style="top: 12%; left: 65%; width: 3px; height: 3px; animation-delay: 1.3s;"></span>

            <span class="star-cross" style="top: 20%; left: 75%; animation-delay: 0.5s;">✦</span>
            <span class="star-cross" style="top: 68%; left: 22%; animation-delay: 1.2s;">✦</span>
            <span class="star-cross" style="top: 30%; left: 14%; animation-delay: 0.8s;">★</span>
            <span class="star-cross" style="top: 80%; left: 78%; animation-delay: 1.6s;">✦</span>
        </div>

        <div class="splash-stage">

            <!-- Logo Sweep Container -->
            <div class="logo-sweep-container">
                <!-- Faint Logo Badge (Illuminates as light sweeps) -->
                <div class="splash-logo-ring">
                    <img src="app_logo.jpeg" alt="SikshaNidhi Logo" class="splash-logo-img">
                </div>

                <!-- Light Sweep Beam Streak -->
                <div class="light-sweep-beam"></div>

                <!-- Subtle Trailing Sparkles -->
                <div class="sweep-sparkles">
                    <span class="sparkle-dot sp1"></span>
                    <span class="sparkle-dot sp2"></span>
                    <span class="sparkle-dot sp3"></span>
                </div>
            </div>

            <!-- Brand Name -->
            <div class="splash-app-name" data-i18n="app_name">SikshaNidhi</div>

            <!-- Tagline -->
            <div class="splash-tagline" data-i18n="hero_tagline">Empowering Education &middot; Unlocking Futures</div>

            <!-- Sleek Horizontal Progress Bar -->
            <div class="splash-bar-wrap">
                <div class="splash-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Split Screen Main Page -->
    <div class="page-container">

        <!-- Left Hero Side -->
        <div class="hero-section">
            <img src="pic.jpeg" alt="SikshaNidhi" class="hero-full-img">
        </div>

        <!-- Right Form Side -->
        <div class="form-section">
            
            <!-- Top Right Bar with Language Button -->
            <div class="top-right-bar">
                <button type="button" class="lang-btn" onclick="showLanguagePopup()" title="Change Language">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
                    </svg>
                </button>
            </div>

            <!-- LOGIN FORM WRAPPER -->
            <div class="form-wrapper" id="loginSection">
                <div class="welcome-subtitle">
                    <span data-i18n="welcome_back">WELCOME BACK</span> 👋
                </div>
                <h2 class="form-title" data-i18n="signin_heading">Sign in to SikshaNidhi</h2>

                <div id="loginError" class="error-message" data-i18n="login_error_invalid">
                    Incorrect email & password
                </div>

                <form id="loginForm">
                    <!-- Email Field -->
                    <div class="field-group">
                        <div class="field-header">
                            <label class="field-label" data-i18n="label_email">Email address</label>
                        </div>
                        <div class="input-box-wrapper">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                            <input type="email" id="loginEmail" class="input-field" placeholder="Enter your email" required data-i18n-placeholder="ph_enter_email">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="field-group">
                        <div class="field-header">
                            <label class="field-label" data-i18n="label_password">Password</label>
                            <a class="forgot-link" data-i18n="forgot_password" onclick="alert('Password reset instructions sent to your email!')">Forgot password?</a>
                        </div>
                        <div class="input-box-wrapper">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="loginPassword" class="input-field has-eye" placeholder="Enter your password" required data-i18n-placeholder="ph_enter_password">
                            <span class="eye-toggle" id="toggleLoginPassword">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span data-i18n="btn_signin_arrow">Sign In  ➔</span>
                    </button>
                </form>

                <div class="form-footer-text">
                    <span data-i18n="new_to_app">New to SikshaNidhi?</span>
                    <a id="showRegisterBtn" data-i18n="create_account_link">Create an account</a>
                </div>
            </div>

            <!-- REGISTER FORM WRAPPER (HIDDEN BY DEFAULT) -->
            <div class="form-wrapper hidden" id="registerSection">
                <div class="welcome-subtitle">
                    <span data-i18n="welcome_register">WELCOME</span> 🚀
                </div>
                <h2 class="form-title" data-i18n="register_heading">Create your SikshaNidhi Account</h2>

                <div id="registerError" class="error-message" data-i18n="register_error_password">
                    Passwords do not match
                </div>

                <form id="registerForm">
                    <!-- Full Name Field -->
                    <div class="field-group">
                        <div class="field-header">
                            <label class="field-label" data-i18n="label_name">Full Name</label>
                        </div>
                        <div class="input-box-wrapper">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input type="text" id="regName" class="input-field" placeholder="Enter your name" required data-i18n-placeholder="ph_enter_name">
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="field-group">
                        <div class="field-header">
                            <label class="field-label" data-i18n="label_email">Email address</label>
                        </div>
                        <div class="input-box-wrapper">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                            <input type="email" id="regEmail" class="input-field" placeholder="Enter your email" required data-i18n-placeholder="ph_enter_email">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="field-group">
                        <div class="field-header">
                            <label class="field-label" data-i18n="label_password">Password</label>
                        </div>
                        <div class="input-box-wrapper">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="regPassword" class="input-field has-eye" placeholder="Enter your password" required data-i18n-placeholder="ph_enter_password">
                            <span class="eye-toggle" id="toggleRegPassword">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="field-group">
                        <div class="field-header">
                            <label class="field-label" data-i18n="label_confirm_password">Confirm Password</label>
                        </div>
                        <div class="input-box-wrapper">
                            <span class="input-icon-left">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="regConfirmPassword" class="input-field has-eye" placeholder="Confirm your password" required disabled data-i18n-placeholder="ph_confirm_pass_input">
                            <span class="eye-toggle" id="toggleRegConfirmPassword">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span data-i18n="btn_register_arrow">Create Account  ➔</span>
                    </button>
                </form>

                <div class="form-footer-text">
                    <span data-i18n="already_account">Already have an account?</span>
                    <a id="showLoginBtn" data-i18n="sign_in_link">Sign in</a>
                </div>
            </div>

            <!-- Footer spacer -->
            <div style="height: 10px;"></div>
        </div>

    </div>

    <!-- JavaScript Logic Preserved Exactly -->
    <script>
        // --- 1. Toggle forms (Register vs Login) ---
        const registerSection = document.getElementById('registerSection');
        const loginSection = document.getElementById('loginSection');
        const showLoginBtn = document.getElementById('showLoginBtn');
        const showRegisterBtn = document.getElementById('showRegisterBtn');
        const loginError = document.getElementById('loginError');
        const registerError = document.getElementById('registerError');

        // --- Intro Splash Logic ---
        const introOverlay = document.getElementById('intro-overlay');

        function hideIntro() {
            if (!introOverlay) return;
            introOverlay.style.opacity = '0';
            setTimeout(() => {
                introOverlay.style.display = 'none';
            }, 800);
        }

        // Auto-dismiss after opening book sequence & loading bar complete (~3.4s)
        setTimeout(hideIntro, 3400);

        function clearErrors() {
            if (loginError) loginError.classList.remove('show');
            if (registerError) registerError.classList.remove('show');
        }

        showLoginBtn.addEventListener('click', () => {
            registerSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            clearErrors();
        });

        showRegisterBtn.addEventListener('click', () => {
            loginSection.classList.add('hidden');
            registerSection.classList.remove('hidden');
            clearErrors();
        });

        // --- 2. Toggle Password Visibility ---
        function setupPasswordToggle(toggleIconId, passwordInputId) {
            const toggleIcon = document.getElementById(toggleIconId);
            const passwordInput = document.getElementById(passwordInputId);
            if (!toggleIcon || !passwordInput) return;

            toggleIcon.addEventListener('click', function () {
                if (passwordInput.disabled) return;

                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

                this.style.color = isPassword ? '#4f46e5' : '#9ca3af';
            });
        }

        setupPasswordToggle('toggleRegPassword', 'regPassword');
        setupPasswordToggle('toggleRegConfirmPassword', 'regConfirmPassword');
        setupPasswordToggle('toggleLoginPassword', 'loginPassword');

        // --- 3. Registration Logic ---
        const registerForm = document.getElementById('registerForm');
        const regPassword = document.getElementById('regPassword');
        const regConfirmPassword = document.getElementById('regConfirmPassword');

        regPassword.addEventListener('input', function () {
            if (this.value.length > 0) {
                regConfirmPassword.disabled = false;
            } else {
                regConfirmPassword.disabled = true;
                regConfirmPassword.value = '';
                registerError.classList.remove('show');
            }
        });

        registerForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = regPassword.value;
            const confirmPassword = regConfirmPassword.value;

            if (password !== confirmPassword) {
                registerError.classList.add('show');
                return;
            }

            registerError.classList.remove('show');
            localStorage.setItem('savedName', name);
            localStorage.setItem('savedEmail', email);
            localStorage.setItem('savedPassword', password);

            registerForm.reset();
            regConfirmPassword.disabled = true;
            registerSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            clearErrors();

            document.getElementById('loginEmail').value = email;
        });

        // --- 4. Login Logic ---
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const enteredEmail = document.getElementById('loginEmail').value;
            const enteredPassword = document.getElementById('loginPassword').value;

            const savedEmail = localStorage.getItem('savedEmail');
            const savedPassword = localStorage.getItem('savedPassword');

            // If user hasn't registered yet in localStorage, save the entered credentials to allow smooth demo login
            if (!savedEmail) {
                localStorage.setItem('savedEmail', enteredEmail);
                localStorage.setItem('savedPassword', enteredPassword);
                localStorage.setItem('savedName', enteredEmail.split('@')[0]);
            }

            const currentSavedEmail = localStorage.getItem('savedEmail');
            const currentSavedPassword = localStorage.getItem('savedPassword');

            if (enteredEmail === currentSavedEmail && enteredPassword === currentSavedPassword) {
                loginError.classList.remove('show');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                loginError.classList.add('show');
            }
        });
    </script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
</body>

</html>
